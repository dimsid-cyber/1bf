<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Léo — Parle avec moi !</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="orbe" class="orbe idle"></div>

    <div id="avertissement" class="warn hidden"></div>
    <input id="clavier" class="hidden" placeholder="Ou écris ici et appuie sur Entrée...">

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
